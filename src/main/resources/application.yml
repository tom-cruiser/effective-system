spring:
  application:
    name: wallet-ledger-api
  datasource:
    # Safe local defaults; docker-compose and real deployments override via environment variables.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USERNAME:ledger}
    password: ${DB_PASSWORD:ledger}
  jpa:
    # Flyway owns the schema. Hibernate only checks that the entities match it.
    hibernate:
      ddl-auto: validate
    # Keep DB access inside the service layer, never lazily from controllers/serializers.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  # Responses are JSON; without this springdoc documents them as */*.
  default-produces-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

ledger:
  # Platform commission on ride payments, in basis points (1 bp = 0.01%). 1500 = 15%.
  platform-fee-bps: ${LEDGER_PLATFORM_FEE_BPS:1500}
  security:
    jwt:
      # Deliberately no default: the app refuses to start without JWT_SECRET (at least 32 bytes).
      # docker-compose.yml supplies a local-only value; real deployments inject their own.
      secret: ${JWT_SECRET}
      issuer: wallet-ledger-api
      token-ttl: ${JWT_TOKEN_TTL:1h}
