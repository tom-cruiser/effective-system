spring:
  application:
    name: wallet-ledger-api
  datasource:
    # Safe local defaults; docker-compose and real deployments override via environment variables.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USERNAME:ledger}
    password: ${DB_PASSWORD:ledger}
  jpa:
    # Flyway owns the schema. Hibernate only checks that the entities match it.
    hibernate:
      ddl-auto: validate
    # Keep DB access inside the service layer, never lazily from controllers/serializers.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

ledger:
  # Platform commission on ride payments, in basis points (1 bp = 0.01%). 1500 = 15%.
  platform-fee-bps: ${LEDGER_PLATFORM_FEE_BPS:1500}
