# The datasource is provided by Testcontainers (@ServiceConnection), so nothing DB-specific here.
logging:
  level:
    org.testcontainers: INFO
    bi.gravy.ledger: DEBUG

ledger:
  security:
    jwt:
      # Test-only signing key, used solely against a throwaway Testcontainers database.
      secret: test-only-signing-key-not-used-anywhere-else-0123456789
