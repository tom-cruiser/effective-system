# The browser talks only to this server. /api is proxied to the Spring Boot container, so the app
# and the API share one origin and the API needs no CORS configuration.
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://app:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed bundles never change, so browsers may cache them for a long time.
  location ~* \.(?:js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Client-side routes such as /wallets/123 all load index.html; Angular's router takes over.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
